<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color RGB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="rojo">
            <p class="texto">Rojo (R)</p>
            <input type="range" min="0" max="255" value="0" id="sliderRojo"/>
            <span id="numeroRojo">0</span>
        </div>
        <div id="verde">
            <p class="texto">Verde (G)</p>
            <input type="range" min="0" max="255" value="0" id="sliderVerde"/>
            <span id="numeroVerde">0</span>
        </div>
        <div id="azul">
            <p class="texto">Azul (B)</p>
            <input type="range" min="0" max="255" value="0" id="sliderAzul"/>
            <span id="numeroAzul">0</span>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
